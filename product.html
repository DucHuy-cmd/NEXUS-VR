<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS VR — Chi tiết sản phẩm</title>
<!-- [PHỤ TRÁCH: Nhất Vũ] -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- TẦNG 1: FOUNDATION -->
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/global.css">

<!-- TẦNG 2: COMPONENTS -->
<link rel="stylesheet" href="assets/css/components/navbar.css">
<link rel="stylesheet" href="assets/css/components/footer.css">
<link rel="stylesheet" href="assets/css/components/toast.css">
<link rel="stylesheet" href="assets/css/components/product-card.css">
<link rel="stylesheet" href="assets/css/components/cart-drawer.css">

<!-- TẦNG 3: PAGE CSS RIÊNG -->
<link rel="stylesheet" href="assets/css/pages/product-detail.css">
</head>
<body data-page="product">

<div id="navbar-root"></div>

<main class="product-detail-page">
  <div class="wrap">

    <!-- Breadcrumb -->
    <nav class="breadcrumb" aria-label="breadcrumb">
      <a href="index.html">Trang chủ</a><span>/</span>
      <a href="shop.html">Cửa hàng</a><span>/</span>
      <span id="pd-breadcrumb-current">Chi tiết sản phẩm</span>
    </nav>

    <!-- Toàn bộ khối chi tiết sản phẩm chỉ hiện ra sau khi product-controller.js
         tìm thấy sản phẩm hợp lệ theo ?id=... và render xong dữ liệu, tránh
         nháy giao diện rỗng. Nếu ID không hợp lệ, JS sẽ chuyển hướng sang
         404.html trước khi khối này kịp hiện ra. -->
    <div id="product-detail-root" hidden>

      <div class="product-detail">
        <!-- GALLERY -->
        <div class="product-detail__gallery">
          <div class="product-detail__main-image" id="pd-main-image">
            <img id="pd-main-img" src="" alt="">
            <span class="product-detail__badge" id="pd-discount-badge" hidden></span>
          </div>
          <div class="product-detail__thumbs" id="pd-thumbs"></div>
        </div>

        <!-- THÔNG TIN -->
        <div class="product-detail__info">
          <span class="product-detail__category" id="pd-category"></span>
          <h1 class="product-detail__title" id="pd-title"></h1>

          <div class="product-detail__rating">
            <span class="product-detail__stars" id="pd-stars" aria-hidden="true"></span>
            <span id="pd-rating-value"></span>
            <span class="product-detail__review-count" id="pd-review-count"></span>
          </div>

          <div class="product-detail__price-row">
            <span class="product-detail__price-now" id="pd-price-now"></span>
            <span class="product-detail__price-old" id="pd-price-old" hidden></span>
            <span class="product-detail__discount-pct" id="pd-discount-pct" hidden></span>
          </div>

          <p class="product-detail__short-desc" id="pd-short-desc"></p>

          <div class="product-detail__colors" id="pd-colors" hidden>
            <span class="product-detail__colors-label">Màu sắc: <strong id="pd-color-selected-name"></strong></span>
            <div class="product-detail__color-swatches" id="pd-color-swatches"></div>
          </div>

          <div class="product-detail__stock" id="pd-stock"></div>

          <div class="product-detail__actions">
            <div class="product-detail__qty">
              <button type="button" class="product-detail__qty-btn" id="pd-qty-minus" aria-label="Giảm số lượng">−</button>
              <input type="number" id="pd-qty-input" value="1" min="1" max="99" inputmode="numeric" aria-label="Số lượng">
              <button type="button" class="product-detail__qty-btn" id="pd-qty-plus" aria-label="Tăng số lượng">+</button>
            </div>
            <button type="button" class="btn-primary" id="pd-add-to-cart">Thêm vào giỏ hàng</button>
            <button type="button" class="btn-outline product-detail__wishlist-btn" id="pd-wishlist-btn" aria-pressed="false">♡ Yêu thích</button>
          </div>
        </div>
      </div>

      <!-- TABS -->
      <div class="product-detail__tabs" id="pd-tabs">
        <div class="product-detail__tabs-nav" role="tablist">
          <button type="button" class="product-detail__tab-btn is-active" data-tab="desc" role="tab" aria-selected="true">Mô tả</button>
          <button type="button" class="product-detail__tab-btn" data-tab="specs" role="tab" aria-selected="false">Thông số kỹ thuật</button>
          <button type="button" class="product-detail__tab-btn" data-tab="reviews" role="tab" aria-selected="false">Đánh giá (<span id="pd-tab-review-count">0</span>)</button>
        </div>

        <div class="product-detail__tab-panel is-active" data-tab-panel="desc" role="tabpanel">
          <p id="pd-description"></p>
        </div>

        <div class="product-detail__tab-panel" data-tab-panel="specs" role="tabpanel" hidden>
          <table class="product-detail__specs-table" id="pd-specs-table"></table>
        </div>

        <div class="product-detail__tab-panel" data-tab-panel="reviews" role="tabpanel" hidden>
          <div id="pd-reviews-list"></div>
        </div>
      </div>

      <!-- SẢN PHẨM TƯƠNG TỰ (dùng lại components/product-card.css của Hưng) -->
      <div class="product-detail__related">
        <h2>Sản phẩm tương tự</h2>
        <div class="grid-4 mt-24" id="pd-related-grid"></div>
      </div>

    </div>
  </div>
</main>

<div id="footer-root"></div>

<!-- TẦNG 1: DATA & SERVICES -->
<script src="assets/js/data/products-data.js"></script>
<script src="assets/js/services/storage-service.js"></script>
<script src="assets/js/services/api-service.js"></script>

<!-- TẦNG 2: MODULES -->
<script src="assets/js/modules/toast.js"></script>
<script src="assets/js/modules/theme-toggle.js"></script>
<script src="assets/js/modules/layout-loader.js"></script>
<script src="assets/js/modules/validator.js"></script>
<script src="assets/js/modules/counter-engine.js"></script>
<script src="assets/js/modules/slider-engine.js"></script>
<script src="assets/js/modules/accordion-engine.js"></script>
<script src="assets/js/modules/cart-manager.js"></script>

<!-- TẦNG 3: CONTROLLER RIÊNG TRANG NÀY -->
<script src="assets/js/controllers/product-controller.js"></script>
</body>
</html>
