<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Metallic Bronze Gradients -->
    <linearGradient id="bronze-metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B08A"/>
      <stop offset="35%" stop-color="#A67C52"/>
      <stop offset="70%" stop-color="#8B6239"/>
      <stop offset="100%" stop-color="#6E4A28"/>
    </linearGradient>

    <linearGradient id="visor-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2420"/>
      <stop offset="100%" stop-color="#14110F"/>
    </linearGradient>

    <linearGradient id="bronze-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A67C52" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#D4B08A"/>
      <stop offset="100%" stop-color="#A67C52" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="lens-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B08A"/>
      <stop offset="100%" stop-color="#A67C52"/>
    </linearGradient>
  </defs>

  <!-- Side Straps -->
  <path d="M3 32h7M54 32h7" stroke="url(#bronze-metallic)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Top Center Mount -->
  <path d="M32 9v7" stroke="url(#bronze-metallic)" stroke-width="4" stroke-linecap="round"/>

  <!-- Outer Headset Casing (Quiet Luxury Curved Chassis) -->
  <rect x="7" y="16" width="50" height="32" rx="16" fill="url(#bronze-metallic)" stroke="#6E4A28" stroke-width="1.5"/>

  <!-- Inner Dark Glass Visor Screen -->
  <rect x="11" y="20" width="42" height="24" rx="12" fill="url(#visor-glass)"/>

  <!-- Front Display Horizon Optical Lens Rings -->
  <ellipse cx="23" cy="32" rx="6.5" ry="5.5" stroke="url(#lens-glow)" stroke-width="1.6" fill="none"/>
  <circle cx="23" cy="32" r="2.2" fill="#D4B08A" opacity="0.85"/>

  <ellipse cx="41" cy="32" rx="6.5" ry="5.5" stroke="url(#lens-glow)" stroke-width="1.6" fill="none"/>
  <circle cx="41" cy="32" r="2.2" fill="#D4B08A" opacity="0.85"/>

  <!-- Bridge connector between lenses -->
  <path d="M29.5 32h5" stroke="#A67C52" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Nose Relief Contour -->
  <path d="M28 44c2.5-3 5.5-3 8 0" stroke="url(#bronze-metallic)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Premium Specular Glass Sheen Highlight -->
  <path d="M15 24c5-2 13-2.5 17-2.5s12 .5 17 2.5" stroke="#FFF" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <path d="M14 22c3-1 8-1.5 18-1.5s15 .5 18 1.5" stroke="url(#bronze-accent)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
